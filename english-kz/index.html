<title>Ағылшынша Оңай</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap">
<style>
/* Layout: sticky tab bar over a single centered column; topic tiles on home, big flip card for study, chat for the tutor. */
:root {
  --bg: #f1f7f9; --surface: #ffffff; --ink: #10242c; --muted: #546c76;
  --accent: #00839e; --accent-ink: #ffffff; --gold: #f2b705; --gold-soft: #fff3c4;
  --line: #d3e2e8; --good: #1a8a52; --bad: #c43d3d; --soft: #e2f0f4;
  --sans: "Noto Sans", system-ui, sans-serif; --serif: "Noto Serif", Georgia, serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c181d; --surface: #13252c; --ink: #e8f3f6; --muted: #93aeb8;
  --accent: #3fc7e0; --accent-ink: #062a33; --gold: #f5c518; --gold-soft: #3a3210;
  --line: #24404a; --good: #4cc98a; --bad: #ee7a7a; --soft: #1a3640; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c181d; --surface: #13252c; --ink: #e8f3f6; --muted: #93aeb8;
  --accent: #3fc7e0; --accent-ink: #062a33; --gold: #f5c518; --gold-soft: #3a3210;
  --line: #24404a; --good: #4cc98a; --bad: #ee7a7a; --soft: #1a3640; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--surface); z-index: 10; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.brand { font: 700 20px var(--serif); letter-spacing: -.01em; }
.brand b { color: var(--accent); }
.stats { display: flex; gap: 8px; font-size: 14px; font-weight: 600; }
.stat { background: var(--gold-soft); border-radius: 99px; padding: 2px 12px; font-variant-numeric: tabular-nums; }
nav { max-width: 760px; margin: 8px auto 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
nav button { border: 0; background: transparent; padding: 8px 2px; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--muted); min-width: 0; }
@media (max-width: 460px) { nav button { font-size: 12px; } }
.lvl { display: inline-block; font-size: 12px; font-weight: 700; background: var(--gold-soft); border-radius: 99px; padding: 1px 10px; margin-bottom: 8px; }
.rule { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; }
.rule h3 { font: 700 17px/1.3 var(--serif); margin: 0 0 4px; }
.rule p { margin: 0; }
.rule b { color: var(--accent); }
.gq { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.gq .qt { font-weight: 600; margin-bottom: 8px; }
.why { margin-top: 8px; font-size: 14px; color: var(--muted); }
nav button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
main { max-width: 760px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font: 700 28px/1.2 var(--serif); margin: 0 0 6px; text-wrap: balance; }
h2 { font: 700 20px/1.3 var(--serif); margin: 0 0 10px; }
.lead { color: var(--muted); margin: 0 0 20px; max-width: 60ch; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 16px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #2a2100; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.progress { height: 8px; border-radius: 9px; background: var(--soft); overflow: hidden; margin: 6px 0 22px; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.tile:hover { border-color: var(--accent); }
.tile .en { font: 700 22px var(--serif); color: var(--accent); }
.tile .kk { font-weight: 600; }
.tile small { color: var(--muted); display: block; }
.tile.done { background: var(--soft); }
.word { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
.word .en { font: 700 20px var(--serif); }
.word .tr { color: var(--accent); font-weight: 600; font-size: 14px; }
.word .kk { font-weight: 600; }
.word .ex { grid-column: 1 / -1; color: var(--muted); font-size: 14px; border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 4px; }
.say { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--soft); font-size: 18px; }
.tip { background: var(--gold-soft); border-radius: 12px; padding: 12px 16px; margin: 0 0 16px; }
.card { perspective: 900px; margin: 8px 0 16px; }
.card button { width: 100%; min-height: 240px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.card .big { font: 700 clamp(32px, 9vw, 48px)/1.15 var(--serif); }
.card .big.kk { font-family: var(--sans); color: var(--accent); }
.card .hint { color: var(--muted); font-size: 14px; }
.opts { display: grid; gap: 8px; }
.opts button { text-align: left; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.opts button.ok { background: var(--good); border-color: var(--good); color: #fff; }
.opts button.no { background: var(--bad); border-color: var(--bad); color: #fff; }
.q { font: 700 clamp(28px, 8vw, 40px)/1.2 var(--serif); margin: 12px 0 18px; }
.chat { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.msg { padding: 10px 14px; border-radius: 14px; max-width: 92%; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); }
.msg.ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #2a2100; font-weight: 600; }
form.ask { display: flex; gap: 8px; }
form.ask input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 14px; font: inherit; }
.back { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 0 0 10px; }
.result { text-align: center; padding: 28px 0; }
.result .score { font: 700 56px var(--serif); color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header>
  <div class="bar">
    <div class="brand">Ағылшынша <b>оңай</b></div>
    <div class="stats"><span class="stat" id="st-streak"></span><span class="stat" id="st-xp"></span></div>
  </div>
  <nav role="tablist" aria-label="Бөлімдер">
    <button role="tab" data-tab="home">Сөздер</button>
    <button role="tab" data-tab="gram">Грамматика</button>
    <button role="tab" data-tab="cards">Карточка</button>
    <button role="tab" data-tab="quiz">Тест</button>
    <button role="tab" data-tab="ai">AI мұғалім</button>
  </nav>
</header>
<main id="app"></main>

<script>
const TOPICS = [
  { id: 'greet', en: 'Greetings', kk: 'Сәлемдесу', tip: 'Ағылшынша "Мен" — I, "сен" — you. "Мен жақсымын" деп айту үшін: I am fine. Сөйлем әрқашан бастауышпен басталады.', words: [
    ['Hello','Сәлем','хелоу','Hello, my name is Aida.','Сәлем, менің атым Аида.'],
    ['Goodbye','Сау болыңыз','гудбай','Goodbye, see you tomorrow.','Сау болыңыз, ертең кездескенше.'],
    ['Thank you','Рақмет','сэнк ю','Thank you very much.','Көп рақмет.'],
    ['Please','Өтінемін','плиз','Water, please.','Су беріңіз, өтінемін.'],
    ['Sorry','Кешіріңіз','сори','Sorry, I am late.','Кешіріңіз, мен кешіктім.'],
    ['Yes','Иә','йес','Yes, I understand.','Иә, түсіндім.'],
    ['No','Жоқ','ноу','No, thank you.','Жоқ, рақмет.'],
    ['How are you?','Жағдайыңыз қалай?','хау а ю','Hello! How are you?','Сәлем! Жағдайыңыз қалай?']]},
  { id: 'num', en: 'Numbers', kk: 'Сандар', tip: 'Он үшеуден он тоғызға дейін -teen қосымшасы жалғанады: thir-teen, four-teen. Ал -ty жиырма, отыз сияқты ондықтарды білдіреді.', words: [
    ['One','Бір','уан','I have one brother.','Менің бір ағам бар.'],
    ['Two','Екі','ту','Two teas, please.','Екі шай беріңіз.'],
    ['Three','Үш','сри','Three books.','Үш кітап.'],
    ['Four','Төрт','фо','Four people.','Төрт адам.'],
    ['Five','Бес','файв','Five minutes.','Бес минут.'],
    ['Six','Алты','сикс','Six apples.','Алты алма.'],
    ['Seven','Жеті','севен','Seven days.','Жеті күн.'],
    ['Ten','Он','тен','Ten tenge.','Он теңге.']]},
  { id: 'family', en: 'Family', kk: 'Отбасы', tip: 'My — менің. My mother = менің анам. Your — сенің: your father = сенің әкең.', words: [
    ['Mother','Ана','мазэ','My mother is a teacher.','Менің анам — мұғалім.'],
    ['Father','Әке','фазэ','My father works here.','Менің әкем осында жұмыс істейді.'],
    ['Brother','Аға / іні','бразэ','He is my brother.','Ол менің ағам.'],
    ['Sister','Әпке / сіңлі','систэ','She is my sister.','Ол менің әпкем.'],
    ['Son','Ұл','сан','My son is five.','Менің ұлым бес жаста.'],
    ['Daughter','Қыз','дотэ','Her daughter is small.','Оның қызы кішкентай.'],
    ['Friend','Дос','френд','He is my best friend.','Ол менің ең жақын досым.'],
    ['Family','Отбасы','фэмили','I love my family.','Мен отбасымды жақсы көремін.']]},
  { id: 'food', en: 'Food and drink', kk: 'Тағам', tip: 'Тілегіңді айту үшін: I want ... (Мен ... қалаймын). I want tea — мен шай қалаймын.', words: [
    ['Water','Су','уотэ','A glass of water.','Бір стақан су.'],
    ['Bread','Нан','бред','I want bread.','Мен нан қалаймын.'],
    ['Milk','Сүт','милк','Milk is good for you.','Сүт денсаулыққа пайдалы.'],
    ['Tea','Шай','ти','Black tea, please.','Қара шай беріңіз.'],
    ['Meat','Ет','мит','I do not eat meat.','Мен ет жемеймін.'],
    ['Apple','Алма','эпл','This apple is sweet.','Бұл алма тәтті.'],
    ['Rice','Күріш','райс','Rice with meat.','Етпен күріш.'],
    ['Egg','Жұмыртқа','эг','Two eggs for breakfast.','Таңғы асқа екі жұмыртқа.']]},
  { id: 'verbs', en: 'Daily verbs', kk: 'Күнделікті етістіктер', tip: 'Ағылшынша етістік сөйлемнің ортасында тұрады: I read books (Мен кітап оқимын). Қазақшада етістік соңында тұрады, мұны есте сақтаңыз.', words: [
    ['Go','Бару','гоу','I go to work.','Мен жұмысқа барамын.'],
    ['Eat','Жеу','ит','We eat at home.','Біз үйде тамақтанамыз.'],
    ['Drink','Ішу','дринк','I drink tea.','Мен шай ішемін.'],
    ['Sleep','Ұйықтау','слип','Children sleep early.','Балалар ерте ұйықтайды.'],
    ['Read','Оқу','рид','I read every day.','Мен күнде оқимын.'],
    ['Write','Жазу','райт','Write your name.','Атыңызды жазыңыз.'],
    ['Speak','Сөйлеу','спик','I speak English.','Мен ағылшынша сөйлеймін.'],
    ['Want','Қалау','уонт','I want to learn.','Мен үйренгім келеді.']]},
  { id: 'travel', en: 'Travel', kk: 'Саяхат', tip: 'Жол сұрау үшін: Where is the ...? (...қайда?). Where is the airport? — Әуежай қайда?', words: [
    ['Ticket','Билет','тикит','One ticket, please.','Бір билет беріңіз.'],
    ['Hotel','Қонақ үй','хоутел','The hotel is near.','Қонақ үй жақын.'],
    ['Airport','Әуежай','эпорт','Where is the airport?','Әуежай қайда?'],
    ['Street','Көше','стрит','Turn left on this street.','Осы көшеден солға бұрылыңыз.'],
    ['Money','Ақша','мани','I have no money.','Менде ақша жоқ.'],
    ['How much?','Қанша тұрады?','хау мач','How much is this?','Бұл қанша тұрады?'],
    ['Help','Көмек','хелп','Can you help me?','Маған көмектесе аласыз ба?'],
    ['Where is...?','...қайда?','уэр из','Where is the station?','Вокзал қайда?']]},
].map(t => ({ ...t, words: t.words.map(([en,kk,tr,ex,exk]) => ({ en, kk, tr, ex, exk, topic: t.id })) }));
const ALL = TOPICS.flatMap(t => t.words);

// ---- persistence (per-viewer only) ----
let P = { xp: 0, streak: 0, last: '', known: {}, done: {}, g: {} };
try { Object.assign(P, JSON.parse(localStorage.getItem('enkz') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('enkz', JSON.stringify(P)); } catch (e) {} };
const today = () => new Date().toISOString().slice(0, 10);
function earn(n) {
  P.xp += n;
  const t = today();
  if (P.last !== t) {
    const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
    P.streak = P.last === y ? P.streak + 1 : 1; P.last = t;
  }
  save(); head();
}
function head() {
  document.getElementById('st-streak').textContent = '🔥 ' + P.streak + ' күн';
  document.getElementById('st-xp').textContent = '⭐ ' + P.xp;
}

// ---- helpers ----
const $ = id => document.getElementById(id);
const app = $('app');
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function say(text) {
  try {
    const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = .85;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}
let tab = 'home', topic = null;
const pool = () => topic ? TOPICS.find(t => t.id === topic).words : ALL;

function go(t) {
  tab = t;
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  ({ home: renderHome, gram: renderGram, cards: startCards, quiz: startQuiz, ai: renderAI })[t]();
  window.scrollTo(0, 0);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  if (b.dataset.tab === 'home') topic = null;
  if (b.dataset.tab === 'gram') gid = null;
  go(b.dataset.tab);
});

// ---- home ----
function renderHome() {
  if (topic) return renderTopic();
  const known = ALL.filter(w => P.known[w.en]).length;
  app.innerHTML = `<h1>Бүгін не үйренеміз?</h1>
  <p class="lead">Тақырыпты таңдаңыз. Әр сөздің қазақша аудармасы мен дыбысталуы қазақ әріптерімен жазылған. 🔊 батырмасын басып, дұрыс айтылуын тыңдаңыз.</p>
  <div><strong>${known} / ${ALL.length}</strong> сөз жаттадыңыз</div>
  <div class="progress"><i style="width:${known / ALL.length * 100}%"></i></div>
  <div class="tiles">${TOPICS.map(t => {
    const k = t.words.filter(w => P.known[w.en]).length;
    return `<button class="tile ${k === t.words.length ? 'done' : ''}" data-t="${t.id}">
      <span class="en">${t.en}</span><span class="kk">${t.kk}</span><small>${k} / ${t.words.length} сөз</small></button>`;
  }).join('')}</div>`;
  app.querySelectorAll('.tile').forEach(b => b.onclick = () => { topic = b.dataset.t; renderHome(); window.scrollTo(0, 0); });
}
function renderTopic() {
  const t = TOPICS.find(x => x.id === topic);
  app.innerHTML = `<button class="back" id="bk">← Барлық тақырыптар</button>
  <h1>${t.en}: ${t.kk}</h1>
  <div class="tip"><strong>Кеңес.</strong> ${t.tip}</div>
  <div class="row" style="margin-bottom:14px"><button class="btn primary" id="go-c">Карточкамен жаттау</button><button class="btn gold" id="go-q">Тест тапсыру</button></div>
  ${t.words.map((w, i) => `<div class="word"><div><div class="en">${esc(w.en)}</div><div class="tr">оқылуы: ${esc(w.tr)}</div><div class="kk">${esc(w.kk)}</div></div>
    <button class="say" data-i="${i}" aria-label="Тыңдау: ${esc(w.en)}">🔊</button>
    <div class="ex">${esc(w.ex)}<br>${esc(w.exk)}</div></div>`).join('')}`;
  $('bk').onclick = () => { topic = null; renderHome(); };
  $('go-c').onclick = () => go('cards'); $('go-q').onclick = () => go('quiz');
  app.querySelectorAll('.say').forEach(b => b.onclick = () => say(t.words[b.dataset.i].en));
}

// ---- flashcards ----
let deck = [], ci = 0, flipped = false, cardRound = 0;
function startCards() {
  deck = shuffle(pool().filter(w => !P.known[w.en]));
  if (!deck.length) deck = shuffle(pool());
  ci = 0; flipped = false; cardRound = 0; renderCard();
}
function renderCard() {
  if (ci >= deck.length) {
    app.innerHTML = `<div class="result"><div class="score">👏</div><h2>Жарайсыз!</h2><p class="lead" style="margin:0 auto 16px">Бұл топтағы карточкалар бітті.</p>
    <div class="row" style="justify-content:center"><button class="btn primary" id="again">Қайта бастау</button><button class="btn" id="hm">Тақырыптарға</button></div></div>`;
    $('again').onclick = startCards; $('hm').onclick = () => { topic = null; go('home'); }; return;
  }
  const w = deck[ci];
  app.innerHTML = `<h1>Карточкалар</h1>
  <p class="lead">${topic ? TOPICS.find(t => t.id === topic).kk : 'Барлық тақырып'} · ${ci + 1} / ${deck.length}. Карточканы басып аударыңыз.</p>
  <div class="card"><button id="flip" aria-live="polite">${flipped
    ? `<span class="big kk">${esc(w.kk)}</span><span class="hint">оқылуы: ${esc(w.tr)}</span><span class="hint">${esc(w.ex)}</span>`
    : `<span class="big">${esc(w.en)}</span><span class="hint">аудармасын көру үшін басыңыз</span>`}</button></div>
  <div class="row"><button class="btn" id="hear">🔊 Тыңдау</button>
  <button class="btn" id="again-c">Қайталаймын</button><button class="btn primary" id="know">Білемін ✓</button></div>`;
  $('flip').onclick = () => { flipped = !flipped; if (flipped) say(w.en); renderCard(); };
  $('hear').onclick = () => say(w.en);
  $('know').onclick = () => { P.known[w.en] = 1; earn(2); ci++; flipped = false; renderCard(); };
  $('again-c').onclick = () => { delete P.known[w.en]; save(); deck.push(w); ci++; flipped = false; renderCard(); };
}

// ---- quiz ----
let qs = [], qi = 0, score = 0;
function startQuiz() {
  const p = pool();
  qs = shuffle(p).slice(0, 8).map((w, i) => {
    const toKk = i % 2 === 0;
    const wrong = shuffle(ALL.filter(x => x.en !== w.en)).slice(0, 3);
    return { w, toKk, opts: shuffle([w, ...wrong]) };
  });
  qi = 0; score = 0; renderQ();
}
function renderQ() {
  if (qi >= qs.length) {
    const pct = Math.round(score / qs.length * 100);
    if (pct >= 70 && topic) { P.done[topic] = 1; save(); }
    app.innerHTML = `<div class="result"><div class="score">${score} / ${qs.length}</div>
    <h2>${pct >= 80 ? 'Тамаша!' : pct >= 50 ? 'Жақсы, әрі қарай!' : 'Қайталап көрейік'}</h2>
    <p class="lead" style="margin:0 auto 16px">Қате жіберген сөздерді карточкамен қайталаңыз.</p>
    <div class="row" style="justify-content:center"><button class="btn primary" id="rt">Қайта тапсыру</button><button class="btn" id="tc">Карточкаға</button></div></div>`;
    $('rt').onclick = startQuiz; $('tc').onclick = () => go('cards'); return;
  }
  const q = qs[qi];
  app.innerHTML = `<h1>Тест</h1><p class="lead">${qi + 1} / ${qs.length} · ${q.toKk ? 'Қазақша аудармасын таңдаңыз' : 'Ағылшынша сөзді таңдаңыз'}</p>
  <div class="q">${esc(q.toKk ? q.w.en : q.w.kk)}</div>
  <div class="opts">${q.opts.map((o, i) => `<button data-i="${i}">${esc(q.toKk ? o.kk : o.en)}</button>`).join('')}</div>`;
  app.querySelectorAll('.opts button').forEach(b => b.onclick = () => {
    const ok = q.opts[b.dataset.i].en === q.w.en;
    app.querySelectorAll('.opts button').forEach((x, i) => { x.disabled = true; if (q.opts[i].en === q.w.en) x.classList.add('ok'); });
    if (!ok) b.classList.add('no'); else { score++; earn(5); }
    if (!ok) { delete P.known[q.w.en]; save(); }
    say(q.w.en);
    setTimeout(() => { qi++; renderQ(); }, 1100);
  });
}

function renderAI() {
  app.innerHTML = `<h1>AI мұғалім</h1>
  <p class="lead">Кез келген сұрағыңызды қазақша жазыңыз. Мұғалім түсіндіреді, қатеңізді түзетеді немесе сізбен ағылшынша сөйлеседі.</p>

  <div class="chat" id="chat" aria-live="polite"></div>

  const chat = $('chat');
  const add = (cls, text) => { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; chat.appendChild(d); return d; };
  if (!hist.length) add('ai', 'Сәлем! Мен сіздің ағылшын мұғалімізбін. Мысалы жазып көріңіз: "Present Simple деген не?" немесе "I goed to school".');

    const wrapped = (hist.length ? '' : `${SYS}\nРежим: ${MODES[mode][1]}\n\n`) + text;
    hist.push({ role: 'user', content: wrapped, shown: text });
    const out = add('ai', '…');
    try {
      const sample = await getSample();
      if (!sample) throw { code: 'none' };
      const r = await sample(hist.map(m => ({ role: m.role, content: m.content })), { cache: false, modelTier: 'quick', onText: ({ text }) => { out.textContent = text; } });

  };
}

let gid = null;
function renderGram() {
  if (gid) return renderLesson();
  const done = GRAMMAR.filter(g => P.g[g.id] >= 2).length;
  const lvName = { A1: 'Бастапқы деңгей (A1)', A2: 'Орташа деңгей (A2)' };
  app.innerHTML = `<h1>Грамматика</h1>
  <p class="lead">Артикльдерден бастап етістік шақтарына дейін, қазақша түсіндірмемен. Әр сабақта ереже, мысал және 3 сұрақ бар. Ретімен өтуді ұсынамыз.</p>
  <div><strong>${done} / ${GRAMMAR.length}</strong> сабақ өтілді</div>
  <div class="progress"><i style="width:${done / GRAMMAR.length * 100}%"></i></div>
  ${['A1', 'A2'].map(l => `<h2>${lvName[l]}</h2><div class="tiles" style="margin-bottom:22px">${GRAMMAR.filter(g => g.lv === l).map(g =>
    `<button class="tile ${P.g[g.id] >= 2 ? 'done' : ''}" data-g="${g.id}"><span class="en">${g.en}</span><span class="kk">${g.kk}</span>
     <small>${P.g[g.id] != null ? P.g[g.id] + ' / 3 дұрыс' : 'әлі өтілмеген'}</small></button>`).join('')}</div>`).join('')}`;
  app.querySelectorAll('.tile').forEach(b => b.onclick = () => { gid = b.dataset.g; renderGram(); window.scrollTo(0, 0); });
}
function renderLesson() {
  const g = GRAMMAR.find(x => x.id === gid), next = GRAMMAR[GRAMMAR.indexOf(g) + 1];
  app.innerHTML = `<button class="back" id="bk">← Барлық ережелер</button>
  <div class="lvl">${g.lv}</div><h1>${g.en}</h1>
  <p class="lead">${g.kk}. ${g.intro}</p>
  ${g.rules.map(([h, b]) => `<div class="rule"><h3>${h}</h3><p>${b}</p></div>`).join('')}
  <h2 style="margin-top:20px">Мысалдар</h2>
  ${g.ex.map(([e, k], i) => `<div class="word"><div><div class="en" style="font-size:17px">${esc(e)}</div><div class="kk" style="font-weight:500">${esc(k)}</div></div>
    <button class="say" data-i="${i}" aria-label="Тыңдау">🔊</button></div>`).join('')}
  <h2 style="margin-top:20px">Жаттығу</h2><div id="gq"></div><div id="gsum"></div>`;
  $('bk').onclick = () => { gid = null; renderGram(); };
  app.querySelectorAll('.say').forEach(b => b.onclick = () => say(g.ex[b.dataset.i][0].replace(/–/g, ',')));
  let answered = 0, right = 0;
  g.q.forEach(([q, o, a, why], qi) => {
    const d = document.createElement('div'); d.className = 'gq';
    d.innerHTML = `<div class="qt">${qi + 1}. ${esc(q)}</div><div class="opts">${o.map((t, k) => `<button data-k="${k}">${esc(t)}</button>`).join('')}</div><div class="why" hidden></div>`;
    d.querySelectorAll('.opts button').forEach(b => b.onclick = () => {
      const ok = +b.dataset.k === a;
      d.querySelectorAll('.opts button').forEach((x, j) => { x.disabled = true; if (j === a) x.classList.add('ok'); });
      if (ok) { right++; earn(5); } else b.classList.add('no');
      const w = d.querySelector('.why'); w.hidden = false;
      w.textContent = (ok ? 'Дұрыс! ' : 'Дұрыс жауабы: ' + o[a] + '. ') + why;
      if (++answered === g.q.length) {
        P.g[g.id] = Math.max(P.g[g.id] ?? 0, right); save();
        $('gsum').innerHTML = `<div class="tip"><strong>${right} / ${g.q.length} дұрыс.</strong> ${right >= 2 ? 'Сабақ өтілді!' : 'Ережені қайта оқып, тағы бір рет көріңіз.'}</div>
        <div class="row"><button class="btn" id="rt">Қайталау</button>${next ? `<button class="btn primary" id="nx">Келесі: ${next.en}</button>` : ''}</div>`;
        $('rt').onclick = renderLesson;
        if (next) $('nx').onclick = () => { gid = next.id; renderLesson(); window.scrollTo(0, 0); };
      }
    });
    $('gq').appendChild(d);
  });
}
