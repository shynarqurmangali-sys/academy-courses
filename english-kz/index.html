<title>Ағылшынша Оңай</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap">
<style>
/* Layout: one centered column. Home is a staged learning path; a lesson takes the whole column with a progress bar and a sticky answer footer. */
:root {
  --bg: #f1f7f9; --surface: #ffffff; --ink: #10242c; --muted: #546c76;
  --accent: #00839e; --accent-ink: #ffffff; --gold: #f2b705; --gold-soft: #fff3c4;
  --line: #d3e2e8; --good: #167a48; --bad: #b83232; --soft: #e2f0f4;
  --good-soft: #dff3e7; --bad-soft: #fbe3e3;
  --sans: "Noto Sans", system-ui, sans-serif; --serif: "Noto Serif", Georgia, serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c181d; --surface: #13252c; --ink: #e8f3f6; --muted: #93aeb8;
  --accent: #3fc7e0; --accent-ink: #062a33; --gold: #f5c518; --gold-soft: #3a3210;
  --line: #24404a; --good: #4cc98a; --bad: #ee7a7a; --soft: #1a3640;
  --good-soft: #15382a; --bad-soft: #3d1d1d; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c181d; --surface: #13252c; --ink: #e8f3f6; --muted: #93aeb8;
  --accent: #3fc7e0; --accent-ink: #062a33; --gold: #f5c518; --gold-soft: #3a3210;
  --line: #24404a; --good: #4cc98a; --bad: #ee7a7a; --soft: #1a3640;
  --good-soft: #15382a; --bad-soft: #3d1d1d; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--surface); z-index: 10; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
button:focus:not(:focus-visible) { outline: none; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.brand { font: 700 20px var(--serif); letter-spacing: -.01em; }
.brand b { color: var(--accent); }
.stats { display: flex; gap: 8px; font-size: 14px; font-weight: 600; }
.stat { background: var(--gold-soft); border-radius: 99px; padding: 2px 12px; font-variant-numeric: tabular-nums; }
nav { max-width: 760px; margin: 8px auto 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
nav button { border: 0; background: transparent; padding: 8px 2px; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--muted); min-width: 0; }
nav button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
body.in-lesson nav { display: none; }
main { max-width: 760px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font: 700 28px/1.2 var(--serif); margin: 0 0 6px; text-wrap: balance; }
h2 { font: 700 20px/1.3 var(--serif); margin: 0 0 10px; text-wrap: balance; }
.lead { color: var(--muted); margin: 0 0 20px; max-width: 60ch; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 18px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.wide { width: 100%; font-size: 17px; padding: 13px 18px; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.progress { height: 8px; border-radius: 9px; background: var(--soft); overflow: hidden; margin: 6px 0 22px; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.hero { background: var(--accent); color: var(--accent-ink); border-radius: 16px; padding: 18px 20px; margin-bottom: 26px; }
.hero small { opacity: .85; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 12px; }
.hero h2 { margin: 2px 0 2px; font-size: 24px; }
.hero p { margin: 0 0 14px; opacity: .92; }
.hero .btn { background: var(--gold); border-color: var(--gold); color: #2a2100; }
.stage { margin-bottom: 26px; }
.stage h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.stage h2 span { font: 600 13px var(--sans); color: var(--muted); white-space: nowrap; }
.node { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; }
.node .n { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--soft); color: var(--accent); }
.node.done .n { background: var(--accent); color: var(--accent-ink); }
.node.next { border: 2px solid var(--accent); padding: 9px 13px; }
.node.lock { opacity: .5; }
.node b { display: block; line-height: 1.3; }
.node small { color: var(--muted); display: block; overflow-wrap: anywhere; }
.node > span:nth-child(2) { min-width: 0; }
.stars { color: var(--gold); letter-spacing: 2px; font-size: 15px; white-space: nowrap; }
.lbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.lbar .progress { flex: 1; margin: 0; height: 12px; }
.x { border: 0; background: var(--soft); width: 36px; height: 36px; border-radius: 50%; font-size: 16px; color: var(--muted); }
#foot { position: sticky; bottom: 0; background: var(--bg); padding-top: 12px; padding-bottom: env(safe-area-inset-bottom, 0px); margin-top: 18px; }
.fb { border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.fb.ok { background: var(--good-soft); }
.fb.no { background: var(--bad-soft); }
.fb strong { display: block; }
.fb.ok strong { color: var(--good); }
.fb.no strong { color: var(--bad); }
.fb p { margin: 2px 0 0; font-size: 15px; }
.teach { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px; text-align: center; }
.teach .big { font: 700 clamp(34px, 10vw, 52px)/1.1 var(--serif); }
.teach .kk { font: 700 24px var(--sans); color: var(--accent); margin: 6px 0; }
.teach .tr { color: var(--muted); }
.teach .ex { border-top: 1px dashed var(--line); margin-top: 14px; padding-top: 12px; text-align: left; }
.teach .ex div:first-child { font-weight: 600; }
.teach .ex div:last-child { color: var(--muted); font-size: 15px; }
.say { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--soft); font-size: 20px; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; background: var(--gold-soft); border-radius: 99px; padding: 1px 10px; margin-bottom: 10px; }
.rule { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
.rule h3 { font: 700 18px/1.3 var(--serif); margin: 0 0 6px; }
.rule p { margin: 0; }
.rule b { color: var(--accent); }
.q { font: 700 clamp(26px, 8vw, 38px)/1.2 var(--serif); margin: 8px 0 16px; overflow-wrap: anywhere; }
.qp { color: var(--muted); font-weight: 600; margin: 0 0 4px; }
.opts { display: grid; gap: 8px; }
.opts button { text-align: left; padding: 13px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.opts button.ok { background: var(--good); border-color: var(--good); color: #fff; }
.opts button.no { background: var(--bad); border-color: var(--bad); color: #fff; }
.answer { min-height: 58px; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 0 10px; margin-bottom: 16px; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; }
.tok { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 18px; }
.tok:disabled { opacity: .25; }
.letters { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; text-align: center; }
.letter { background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px; }
.letter b { display: block; font: 700 30px/1.2 var(--serif); }
.letter span { font-size: 13px; color: var(--accent); font-weight: 700; }
.result { text-align: center; padding: 20px 0; }
.result .score { font-size: 48px; letter-spacing: 6px; color: var(--gold); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #2a2100; font-weight: 600; }
.chat { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.msg { padding: 10px 14px; border-radius: 14px; max-width: 92%; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); }
.msg.ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); }
form.ask { display: flex; gap: 8px; }
form.ask input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 14px; font: inherit; }
.back { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 0 0 10px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin-bottom: 22px; }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; min-width: 0; }
.tile:hover { border-color: var(--accent); }
.tile b { display: block; color: var(--accent); font: 700 18px var(--serif); }
.word { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; }
.word .en { font: 700 18px var(--serif); }
.word .kk { color: var(--muted); }
.word .say { width: 44px; height: 44px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header>
  <div class="bar">
    <div class="brand">Ағылшынша <b>оңай</b></div>
    <div class="stats"><span class="stat" id="st-streak"></span><span class="stat" id="st-xp"></span></div>
  </div>
  <nav role="tablist" aria-label="Бөлімдер">
    <button role="tab" data-tab="path">Жол</button>
    <button role="tab" data-tab="review">Қайталау</button>
    <button role="tab" data-tab="ref">Ережелер</button>
    <button role="tab" data-tab="ai">AI мұғалім</button>
  </nav>
</header>
<main id="app"></main>

<script>
const TOPICS = [
  { id: 'greet', en: 'Greetings', kk: 'Сәлемдесу', tip: 'Ағылшынша "Мен" — I, "сен" — you. "Мен жақсымын" деп айту үшін: I am fine. Сөйлем әрқашан бастауышпен басталады.', words: [
    ['Hello','Сәлем','хелоу','Hello, my name is Aida.','Сәлем, менің атым Аида.'],
    ['Goodbye','Сау болыңыз','гудбай','Goodbye, see you tomorrow.','Сау болыңыз, ертең кездескенше.'],
    ['Thank you','Рақмет','сэнк ю','Thank you very much.','Көп рақмет.'],
    ['Please','Өтінемін','плиз','Water, please.','Су беріңіз, өтінемін.'],
    ['Sorry','Кешіріңіз','сори','Sorry, I am late.','Кешіріңіз, мен кешіктім.'],
    ['Yes','Иә','йес','Yes, I understand.','Иә, түсіндім.'],
    ['No','Жоқ','ноу','No, thank you.','Жоқ, рақмет.'],
    ['How are you?','Жағдайыңыз қалай?','хау а ю','Hello! How are you?','Сәлем! Жағдайыңыз қалай?']]},
  { id: 'num', en: 'Numbers', kk: 'Сандар', tip: 'Он үшеуден он тоғызға дейін -teen қосымшасы жалғанады: thir-teen, four-teen. Ал -ty жиырма, отыз сияқты ондықтарды білдіреді.', words: [
    ['One','Бір','уан','I have one brother.','Менің бір ағам бар.'],
    ['Two','Екі','ту','Two teas, please.','Екі шай беріңіз.'],
    ['Three','Үш','сри','Three books.','Үш кітап.'],
    ['Four','Төрт','фо','Four people.','Төрт адам.'],
    ['Five','Бес','файв','Five minutes.','Бес минут.'],
    ['Six','Алты','сикс','Six apples.','Алты алма.'],
    ['Seven','Жеті','севен','Seven days.','Жеті күн.'],
    ['Ten','Он','тен','Ten tenge.','Он теңге.']]},
  { id: 'family', en: 'Family', kk: 'Отбасы', tip: 'My — менің. My mother = менің анам. Your — сенің: your father = сенің әкең.', words: [
    ['Mother','Ана','мазэ','My mother is a teacher.','Менің анам — мұғалім.'],
    ['Father','Әке','фазэ','My father works here.','Менің әкем осында жұмыс істейді.'],
    ['Brother','Аға / іні','бразэ','He is my brother.','Ол менің ағам.'],
    ['Sister','Әпке / сіңлі','систэ','She is my sister.','Ол менің әпкем.'],
    ['Son','Ұл','сан','My son is five.','Менің ұлым бес жаста.'],
    ['Daughter','Қыз','дотэ','Her daughter is small.','Оның қызы кішкентай.'],
    ['Friend','Дос','френд','He is my best friend.','Ол менің ең жақын досым.'],
    ['Family','Отбасы','фэмили','I love my family.','Мен отбасымды жақсы көремін.']]},
  { id: 'food', en: 'Food and drink', kk: 'Тағам', tip: 'Тілегіңді айту үшін: I want ... (Мен ... қалаймын). I want tea — мен шай қалаймын.', words: [
    ['Water','Су','уотэ','A glass of water.','Бір стақан су.'],
    ['Bread','Нан','бред','I want bread.','Мен нан қалаймын.'],
    ['Milk','Сүт','милк','Milk is good for you.','Сүт денсаулыққа пайдалы.'],
    ['Tea','Шай','ти','Black tea, please.','Қара шай беріңіз.'],
    ['Meat','Ет','мит','I do not eat meat.','Мен ет жемеймін.'],
    ['Apple','Алма','эпл','This apple is sweet.','Бұл алма тәтті.'],
    ['Rice','Күріш','райс','Rice with meat.','Етпен күріш.'],
    ['Egg','Жұмыртқа','эг','Two eggs for breakfast.','Таңғы асқа екі жұмыртқа.']]},
  { id: 'verbs', en: 'Daily verbs', kk: 'Күнделікті етістіктер', tip: 'Ағылшынша етістік сөйлемнің ортасында тұрады: I read books (Мен кітап оқимын). Қазақшада етістік соңында тұрады, мұны есте сақтаңыз.', words: [
    ['Go','Бару','гоу','I go to work.','Мен жұмысқа барамын.'],
    ['Eat','Жеу','ит','We eat at home.','Біз үйде тамақтанамыз.'],
    ['Drink','Ішу','дринк','I drink tea.','Мен шай ішемін.'],
    ['Sleep','Ұйықтау','слип','Children sleep early.','Балалар ерте ұйықтайды.'],
    ['Read','Оқу','рид','I read every day.','Мен күнде оқимын.'],
    ['Write','Жазу','райт','Write your name.','Атыңызды жазыңыз.'],
    ['Speak','Сөйлеу','спик','I speak English.','Мен ағылшынша сөйлеймін.'],
    ['Want','Қалау','уонт','I want to learn.','Мен үйренгім келеді.']]},
  { id: 'travel', en: 'Travel', kk: 'Саяхат', tip: 'Жол сұрау үшін: Where is the ...? (...қайда?). Where is the airport? — Әуежай қайда?', words: [
    ['Ticket','Билет','тикит','One ticket, please.','Бір билет беріңіз.'],
    ['Hotel','Қонақ үй','хоутел','The hotel is near.','Қонақ үй жақын.'],
    ['Airport','Әуежай','эпорт','Where is the airport?','Әуежай қайда?'],
    ['Street','Көше','стрит','Turn left on this street.','Осы көшеден солға бұрылыңыз.'],
    ['Money','Ақша','мани','I have no money.','Менде ақша жоқ.'],
    ['How much?','Қанша тұрады?','хау мач','How much is this?','Бұл қанша тұрады?'],
    ['Help','Көмек','хелп','Can you help me?','Маған көмектесе аласыз ба?'],
    ['Where is...?','...қайда?','уэр из','Where is the station?','Вокзал қайда?']]},
].map(t => ({ ...t, words: t.words.map(([en,kk,tr,ex,exk]) => ({ en, kk, tr, ex, exk, topic: t.id })) }));
const ALL = TOPICS.flatMap(t => t.words);

// ---- state (per-viewer only) ----
let P = { xp: 0, streak: 0, last: '', done: {}, seen: {}, weak: {}, all: false };
try { Object.assign(P, JSON.parse(localStorage.getItem('enkz2') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('enkz2', JSON.stringify(P)); } catch (e) {} };
const dayStr = d => d.toISOString().slice(0, 10);
function earn(n) {
  P.xp += n;
  const t = dayStr(new Date());
  if (P.last !== t) { P.streak = P.last === dayStr(new Date(Date.now() - 864e5)) ? P.streak + 1 : 1; P.last = t; }
  save(); head();
}
function head() {
  document.getElementById('st-streak').textContent = '🔥 ' + P.streak + ' күн';
  document.getElementById('st-xp').textContent = '⭐ ' + P.xp;
}

// ---- helpers ----
const $ = id => document.getElementById(id);
const app = $('app');
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hasTTS = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
function say(text) {
  if (!hasTTS) return;
  try {
    const u = new SpeechSynthesisUtterance(String(text).replace(/–/g, ',')); u.lang = 'en-US'; u.rate = .85;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}
const bindSay = root => root.querySelectorAll('[data-say]').forEach(b => b.onclick = () => say(b.dataset.say));
// ---- grammar ----
const GRAMMAR = [
{ id: 'art', lv: 'A1', en: 'Articles: a, an, the', kk: 'Артикльдер',
  intro: 'Қазақ тілінде артикль жоқ, ал ағылшынша зат есімнің алдында жиі тұрады. Үш ереже жеткілікті.',
  rules: [
    ['a / an: «бір», белгісіз зат', 'Затты бірінші рет айтқанда немесе кез келген біреуін меңзегенде <b>a</b> қолданамыз: <b>a book</b> (бір кітап), <b>a teacher</b>. Тек жекеше, саналатын зат есіммен тұрады.'],
    ['a мен an айырмасы', 'Артикль келесі сөздің <b>дыбысына</b> байланысты. Дауыссыз дыбыстан бұрын <b>a</b>: a car, a boy. Дауысты дыбыстан бұрын <b>an</b>: an apple, an orange. Әріп емес, дыбыс маңызды: an hour (h оқылмайды), a university («ю» дыбысы дауыссыз).'],
    ['the: белгілі, нақты зат', 'Екі жақ та қай затты айтып тұрғанын білсе, <b>the</b> қолданамыз: Close <b>the</b> door. I saw a dog. <b>The</b> dog was big (бұрын аталған ит). Жалғыз заттарға да the: the sun, the moon.'],
    ['Артикль қойылмайтын жерлер', 'Жалпы ұғымдағы көпше сөздерде, спорт, тағам, тіл атауларында артикль жоқ: I like music. We play football. She speaks English.']],

  ex: [['I am a student.', 'Мен студентпін.'], ['She likes her job.', 'Оған жұмысы ұнайды.'], ['They love us.', 'Олар бізді жақсы көреді.'], ['Give it to him.', 'Оны оған беріңіз.']],

function mk(spec) {
  const [k, a, b] = spec.split(':');
  if (k === 'L') { const h = +a; return { id: spec, kind: 'L', letters: LET.slice(h * 13, h * 13 + 13), title: h ? 'Әліпби: N–Z' : 'Әліпби: A–M', sub: '13 әріп, аты мен дыбысы' }; }
  if (k === 'V') { const t = TOPICS.find(x => x.id === a), ws = t.words.slice(b * 4, b * 4 + 4); return { id: spec, kind: 'V', words: ws, title: `${t.kk} · ${+b + 1}/2`, sub: ws.map(w => w.en).join(', ') }; }
  const g = GRAMMAR.find(x => x.id === a);
  return { id: spec, kind: 'G', g, title: g.kk, sub: g.en };
}
const PATH = STAGES.map(([name, list]) => ({ name, units: list.map(mk) }));
const FLAT = PATH.flatMap(s => s.units);

const uniq = a => [...new Set(a)];

const exListen = w => hasTTS ? { t: 'mcq', qp: 'Тыңдап, мағынасын таңдаңыз', listen: w.en, opts: options(w.kk, KKS), a: w.kk, w, after: `${w.en} — ${w.kk}` } : exEnKk(w);
const exArr = (en, kk, w) => en.split(' ').length < 3 ? exKkEn(w) : { t: 'arr', en, kk, w };

function vSteps(u) {
  const [a, b, c, d] = u.words;
  const mix = shuffle([exKkEn(a), exKkEn(b), exKkEn(c), exKkEn(d), exListen(a), exListen(c), exArr(b.ex, b.exk, b), exArr(d.ex, d.exk, d)]);
  return [teachWord(a), teachWord(b), exEnKk(a), exEnKk(b), teachWord(c), teachWord(d), exEnKk(c), exEnKk(d), ...mix];
}
function gSteps(g) {
  const rs = g.rules.map(teachRule);
  const qs = g.q.map(([q, o, a, why]) => ({ t: 'mcq', qp: 'Дұрысын таңдаңыз', q, opts: shuffle(o), a: o[a], why }));

  const sent = g.ex.filter(([e]) => !e.includes('–') && e.split(' ').length >= 3);
  const arr = shuffle(sent).slice(0, 2).map(([e, k]) => ({ t: 'arr', en: e, kk: k }));
  const pool = g.ex.length >= 4 ? g.ex.map(e => e[0]) : GEN;
  const tr = shuffle(g.ex).slice(0, 2).map(([e, k]) => ({ t: 'mcq', qp: 'Ағылшынша қалай айтылады?', q: k, opts: options(e, pool), a: e, sayAns: e }));
  return [intro, ...rs.slice(0, 2), qs[0], ...rs.slice(2), qs[1], exs, ...qs.slice(2), ...arr, ...tr].filter(Boolean);
}
function lSteps(u) {
  const Ls = u.letters, names = Ls.map(x => x[1]), chars = Ls.map(x => x[0]);
  const nameQ = l => ({ t: 'mcq', qp: 'Бұл әріп қалай аталады?', q: l[0], say: l[0], opts: options(l[1], names), a: l[1], after: `${l[0]} — «${l[1]}»` });
  const charQ = l => ({ t: 'mcq', qp: `«${l[1]}» қай әріп?`, q: '?', opts: options(l[0], chars), a: l[0] });
  const hearQ = l => hasTTS ? { t: 'mcq', qp: 'Тыңдап, әріпті таңдаңыз', listen: l[0], opts: options(l[0], chars), a: l[0], after: `${l[0]} — «${l[1]}»` } : charQ(l);
  const grid = g => ({ t: 'teach', html: `<h2>Әріпті басып тыңдаңыз</h2><div class="letters">${g.map(([c, n]) => `<button class="letter" data-say="${c}" aria-label="${c}"><b>${c}</b><span>${n}</span></button>`).join('')}</div>` });
  const g1 = Ls.slice(0, 7), g2 = Ls.slice(7);
  return [grid(g1), ...shuffle(g1).slice(0, 4).map(nameQ), grid(g2), ...shuffle(g2).slice(0, 4).map(nameQ),
    ...shuffle([hearQ(g1[0]), hearQ(g2[0]), charQ(g1[3]), charQ(g2[3]), hearQ(g1[5])])];
}
const build = u => u.kind === 'V' ? vSteps(u) : u.kind === 'L' ? lSteps(u) : gSteps(u.g);

function weak(w, d) {

  if (n) P.weak[w.en] = n; else delete P.weak[w.en];
}
const praise = () => ['Дұрыс!', 'Тамаша!', 'Жарайсыз!', 'Керемет!'][Math.floor(Math.random() * 4)];
function step() {
  if (L.i >= L.steps.length) return finish();
  const s = L.steps[L.i];
  app.innerHTML = `<div class="lbar"><button class="x" id="ex" aria-label="Сабақтан шығу">✕</button><div class="progress"><i style="width:${Math.round(L.i / L.steps.length * 100)}%"></i></div></div><div id="stage"></div><div id="foot"></div>`;
  $('ex').onclick = exitRun;
  const st = $('stage'), ft = $('foot');
  ({ teach: teachStep, mcq: mcqStep, arr: arrStep })[s.t](s, st, ft);
  window.scrollTo(0, 0);
}
function next() { L.i++; step(); }
function feedback(ft, ok, s, ans) {
  ft.innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}"><strong>${ok ? praise() : 'Дұрыс жауабы: ' + esc(ans)}</strong>${s.after || s.why ? `<p>${esc(s.after || s.why)}</p>` : ''}</div><button class="btn primary wide" id="nx">Жалғастыру</button>`;
  $('nx').onclick = next; $('nx').focus();
}
function judge(s, ok) {
  if (!ok) { L.wrong++; if (!s.retry) L.steps.push({ ...s, retry: true, opts: s.opts && shuffle(s.opts) }); }
  weak(s.w, ok ? -1 : 1); save();
}
function teachStep(s, st, ft) {
  st.innerHTML = s.html; bindSay(st); if (s.say) say(s.say);
  ft.innerHTML = '<button class="btn primary wide" id="nx">Түсінікті</button>'; $('nx').onclick = next;
}
function mcqStep(s, st, ft) {
  st.innerHTML = `<p class="qp">${esc(s.qp)}</p>${s.listen
    ? `<button class="say" data-say="${esc(s.listen)}" aria-label="Тыңдау" style="width:76px;height:76px;font-size:32px;margin:6px 0 16px">🔊</button>`
    : `<div class="q">${esc(s.q)}</div>`}<div class="opts">${s.opts.map((o, k) => `<button data-k="${k}">${esc(o)}</button>`).join('')}</div>`;
  bindSay(st); if (s.say || s.listen) say(s.say || s.listen);
  st.querySelectorAll('.opts button').forEach(b => b.onclick = () => {
    const ok = s.opts[b.dataset.k] === s.a;
    st.querySelectorAll('.opts button').forEach((x, j) => { x.disabled = true; if (s.opts[j] === s.a) x.classList.add('ok'); });
    if (!ok) b.classList.add('no');
    judge(s, ok); if (s.sayAns) say(s.sayAns);
    feedback(ft, ok, s, s.a);
  });
}
function arrStep(s, st, ft) {
  const toks = s.en.split(' ').map((w, i) => ({ w, i })), bank = shuffle(toks);
  let ans = [], locked = false;
  const draw = () => {
    st.innerHTML = `<p class="qp">Ағылшынша құрастырыңыз</p><div class="q" style="font-size:24px">${esc(s.kk)}</div>
      <div class="answer">${ans.map(t => `<button class="tok" data-r="${t.i}">${esc(t.w)}</button>`).join('')}</div>
      <div class="bank">${bank.map(t => `<button class="tok" data-a="${t.i}" ${ans.includes(t) ? 'disabled' : ''}>${esc(t.w)}</button>`).join('')}</div>`;
    st.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { ans.push(toks[+b.dataset.a]); draw(); });
    st.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { ans = ans.filter(t => t.i !== +b.dataset.r); draw(); });
    ft.innerHTML = `<button class="btn primary wide" id="ck" ${ans.length === toks.length ? '' : 'disabled'}>Тексеру</button>`;
    $('ck').onclick = () => {
      const ok = ans.map(t => t.w).join(' ') === s.en;
      st.querySelectorAll('.tok').forEach(b => b.disabled = true);
      judge(s, ok); say(s.en); feedback(ft, ok, s, s.en);
    };
  };
  draw();
}
function finish() {
  const u = L.u, review = L.mode === 'review';
  const stars = L.wrong === 0 ? 3 : L.wrong <= 2 ? 2 : 1;
  if (!review) {
    P.done[u.id] = Math.max(P.done[u.id] || 0, stars);
    if (u.kind === 'V') u.words.forEach(w => P.seen[w.en] = 1);
  }
  const xp = review ? 10 : 10 + stars * 5;
  earn(xp);
  const idx = FLAT.indexOf(u), nx = !review && FLAT[idx + 1];
  const msg = ['', 'Жақсы бастама! Қайталасаңыз, жұлдыз көбейеді.', 'Өте жақсы!', 'Мінсіз! Бірде-бір қате жоқ.'][stars];
  app.innerHTML = `<div class="result"><div class="score">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
    <h1>${review ? 'Қайталау аяқталды' : 'Сабақ аяқталды'}</h1><p class="lead" style="margin:0 auto 6px">${review ? 'Қате жіберген сөздер келесі қайталауда қайта шығады.' : msg}</p>
    <p><strong>+${xp} ұпай</strong></p>
    <div class="row" style="justify-content:center;margin-top:16px">${nx ? '<button class="btn primary" id="nx">Келесі сабақ</button>' : ''}<button class="btn" id="bk">${review ? 'Қайталау бөліміне' : 'Жолға қайту'}</button></div></div>`;
  if (nx) $('nx').onclick = () => startRun({ u: nx, steps: build(nx) });
  $('bk').onclick = exitRun;
  window.scrollTo(0, 0);
}

// ---- screens ----
const unlocked = i => P.all || i === 0 || P.done[FLAT[i - 1].id];
function renderPath() {
  const ni = FLAT.findIndex(u => !P.done[u.id]), n = FLAT[ni];
  const done = FLAT.filter(u => P.done[u.id]).length;
  let i = 0;
  app.innerHTML = `<h1>Ағылшынша нөлден бастаймыз</h1>
  <p class="lead">Ретімен жүріңіз: әріптен сөзге, сөзден сөйлемге. Әр сабақ 3-5 минут. Қате жауап соңында қайта сұралады, сондықтан қателесуден қорықпаңыз.</p>
  ${n ? `<div class="hero"><small>${done ? 'Келесі сабақ' : 'Бірінші сабақ'}</small><h2>${esc(n.title)}</h2><p>${esc(n.sub)}</p><button class="btn" id="go-n">${done ? 'Жалғастыру' : 'Бастау'}</button></div>`
    : '<div class="hero"><h2>Барлық сабақ өтілді!</h2><p>Қайталау бөлімінде сөздерді бекітіп, AI мұғаліммен сөйлесіңіз.</p></div>'}
  <div><strong>${done} / ${FLAT.length}</strong> сабақ өтілді</div><div class="progress"><i style="width:${done / FLAT.length * 100}%"></i></div>
  ${PATH.map(s => `<section class="stage"><h2>${s.name}<span>${s.units.filter(u => P.done[u.id]).length} / ${s.units.length}</span></h2>${s.units.map(u => {
    const k = i++, d = P.done[u.id], lock = !unlocked(k);
    return `<button class="node ${d ? 'done' : ''} ${k === ni ? 'next' : ''} ${lock ? 'lock' : ''}" data-i="${k}" ${lock ? 'disabled' : ''}>
      <span class="n">${d ? '✓' : k + 1}</span><span><b>${esc(u.title)}</b><small>${esc(u.sub)}</small></span><span class="stars">${d ? '★'.repeat(d) + '☆'.repeat(3 - d) : lock ? 'жабық' : ''}</span></button>`;
  }).join('')}</section>`).join('')}
  <button class="back" id="ua">${P.all ? 'Сабақтарды қайта жабу' : 'Тілді білсеңіз: барлық сабақты ашу'}</button>`;
  const run = k => { const u = FLAT[k]; startRun({ u, steps: build(u) }); };
  if (n) $('go-n').onclick = () => run(ni);
  app.querySelectorAll('.node').forEach(b => b.onclick = () => run(+b.dataset.i));
  $('ua').onclick = () => { P.all = !P.all; save(); renderPath(); };
}
function renderReview() {
  const seen = ALL.filter(w => P.seen[w.en]), wk = seen.filter(w => P.weak[w.en]);
  if (seen.length < 4) {
    app.innerHTML = `<h1>Қайталау</h1><p class="lead">Үйренген сөздеріңіз осында жиналады. Алдымен «Жол» бөлімінде сөз сабақтарын өтіңіз.</p><button class="btn primary" id="gp">Жолға өту</button>`;
    $('gp').onclick = () => go('path'); return;
  }
  app.innerHTML = `<h1>Қайталау</h1><p class="lead">Қайталау сөзді ұмытпауға көмектеседі. Қате жіберген сөздер алдымен шығады.</p>
  <div class="tiles"><div class="tile"><b>${seen.length}</b>сөз үйрендіңіз</div><div class="tile"><b>${wk.length}</b>сөзді қайталау керек</div></div>
  <button class="btn primary wide" id="go-r">10 сұрақтан тұратын қайталау</button>`;
  $('go-r').onclick = () => {
    const pick = shuffle(seen).sort((a, b) => (P.weak[b.en] || 0) - (P.weak[a.en] || 0)).slice(0, 8);
    const f = [exEnKk, exKkEn, exListen, w => exArr(w.ex, w.exk, w)];
    const steps = [...pick.map((w, i) => f[i % 4](w)), ...shuffle(pick).slice(0, 2).map(w => f[Math.floor(Math.random() * 4)](w))];
    startRun({ mode: 'review', u: { id: 'review' }, steps: shuffle(steps) });
  };
}
function renderRef() {
  if (gid === 'alpha') {
    app.innerHTML = `<button class="back" id="bk">← Барлық ережелер</button><h1>Ағылшын әліпбиі</h1><p class="lead">Әріпті басып, оның атын тыңдаңыз.</p>
    <div class="letters">${LET.map(([c, n]) => `<button class="letter" data-say="${c}" aria-label="${c}"><b>${c}</b><span>${n}</span></button>`).join('')}</div>`;
    bindSay(app); $('bk').onclick = () => { gid = null; renderRef(); }; return;
  }
  if (gid) {
    const g = GRAMMAR.find(x => x.id === gid);
    app.innerHTML = `<button class="back" id="bk">← Барлық ережелер</button><span class="tag">${g.lv === 'A0' ? 'дыбыс' : g.lv}</span><h1>${g.en}</h1><p class="lead">${g.kk}. ${g.intro}</p>
    ${g.rules.map(([h, b]) => `<div class="rule"><h3>${h}</h3><p>${b}</p></div>`).join('')}
    <h2 style="margin-top:20px">Мысалдар</h2>${g.ex.map(([e, k]) => `<div class="word"><div><div class="en">${esc(e)}</div><div class="kk">${esc(k)}</div></div><button class="say" data-say="${esc(e)}" aria-label="Тыңдау">🔊</button></div>`).join('')}`;
    bindSay(app); $('bk').onclick = () => { gid = null; renderRef(); }; return;
  }
  const list = FLAT.filter(u => u.kind === 'G').map(u => u.g);
  app.innerHTML = `<h1>Ережелер</h1><p class="lead">Сабақта өткен ережелерді мына жерден қайта оқуға болады.</p>
  <div class="tiles"><button class="tile" data-g="alpha"><b>Әліпби</b>26 әріп және аттары</button>
  ${list.map(g => `<button class="tile" data-g="${g.id}"><b>${g.en}</b>${g.kk}</button>`).join('')}</div>`;
  app.querySelectorAll('.tile').forEach(b => b.onclick = () => { gid = b.dataset.g; renderRef(); window.scrollTo(0, 0); });
}

function go(t) {
  tab = t; gid = null;
  document.body.classList.remove('in-lesson');
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  ({ path: renderPath, review: renderReview, ref: renderRef, ai: renderAI })[t]();
  window.scrollTo(0, 0);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.tab));
head(); go('path');
</script>
